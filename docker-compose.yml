services:
  dagster:
    build: .
    image: fintech-payments-risk-pipeline:local
    ports:
      - "3000:3000"
    environment:
      PIPELINE_START_DATE: ${PIPELINE_START_DATE:-2026-09-01}
    volumes:
      - pipeline-data:/data
      - dagster-home:/opt/dagster/home
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3000/server_info')"]
      interval: 15s
      timeout: 5s
      retries: 10

volumes:
  pipeline-data:
  dagster-home:
