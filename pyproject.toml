[project]
name = "payments-pipeline"
version = "0.1.0"
description = "Payments risk pipeline: synthetic PSP data -> Parquet landing -> dbt/DuckDB marts, orchestrated with Dagster."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "dagster>=1.9",
    "dagster-webserver>=1.9",
    "dagster-dg-cli>=1.11",
    "dagster-dbt>=0.25",
    "dbt-core>=1.9",
    "dbt-duckdb>=1.9",
    "duckdb>=1.1",
    "pyarrow>=17",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
    "pre-commit>=4",
]

[project.scripts]
payments = "payments_pipeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/payments_pipeline"]

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "payments_pipeline"
code_location_target_module = "payments_pipeline.definitions"
code_location_name = "payments_pipeline"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
