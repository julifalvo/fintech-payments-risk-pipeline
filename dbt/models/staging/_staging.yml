models:
  - name: stg_payments__transactions
    description: Typed and deduplicated card transactions. Timestamps are UTC.
    columns:
      - name: transaction_id
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_payments__customers')
                field: customer_id
      - name: merchant_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_payments__merchants')
                field: merchant_id
      - name: amount
        data_tests:
          - not_null
          - value_between:
              arguments:
                min_value: 0
                max_value: 100000000
      - name: currency
        data_tests:
          - relationships:
              arguments:
                to: ref('fx_rates')
                field: currency
      - name: channel
        data_tests:
          - accepted_values:
              arguments:
                values: [ecommerce, pos, mobile]
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: [approved, declined]

  - name: stg_payments__chargebacks
    columns:
      - name: chargeback_id
        data_tests: [unique, not_null]
      - name: transaction_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_payments__transactions')
                field: transaction_id

  - name: stg_payments__customers
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
      - name: kyc_level
        data_tests:
          - accepted_values:
              arguments:
                values: [basic, full]

  - name: stg_payments__merchants
    columns:
      - name: merchant_id
        data_tests: [unique, not_null]
      - name: risk_tier
        data_tests:
          - accepted_values:
              arguments:
                values: [low, medium, high]
